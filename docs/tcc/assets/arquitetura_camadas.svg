<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="844" viewBox="0 0 1040 844" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="844" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,6 L0,12 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Usuario -->
  <rect x="170" y="20" width="700" height="92" rx="12" fill="#ECECEC" stroke="#9E9E9E"/>
  <text x="520" y="56" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Usuário (gestor · enfermagem · administrativo)</text>
  <text x="520" y="84" text-anchor="middle" font-size="17" fill="#444">Pergunta em linguagem natural (português)</text>

  <line x1="520" y1="112" x2="520" y2="158" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Camada 2 -->
  <rect x="120" y="162" width="800" height="96" rx="12" fill="#D9E2F3" stroke="#5B7FB4"/>
  <text x="520" y="196" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F3864">Camada 2 — Governança de entrada</text>
  <text x="520" y="224" text-anchor="middle" font-size="16" fill="#333">Autenticação por perfil · registro da pergunta</text>
  <text x="520" y="246" text-anchor="middle" font-size="16" fill="#333">verificação de conformidade antes de executar</text>

  <line x1="520" y1="258" x2="520" y2="304" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Camada 3 -->
  <rect x="120" y="308" width="800" height="96" rx="12" fill="#E2EFDA" stroke="#70A050"/>
  <text x="520" y="342" text-anchor="middle" font-size="19" font-weight="bold" fill="#375623">Camada 3 — Motor Text-to-SQL</text>
  <text x="520" y="370" text-anchor="middle" font-size="16" fill="#333">LLM traduz a pergunta em SQL somente leitura na Gold</text>
  <text x="520" y="392" text-anchor="middle" font-size="16" fill="#333">guardrails bloqueiam SQL fora do escopo</text>

  <line x1="520" y1="404" x2="520" y2="450" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="432" font-size="14" fill="#666" font-style="italic">SQL validada</text>

  <!-- Camada 1 -->
  <rect x="120" y="454" width="800" height="110" rx="12" fill="#FCE4D6" stroke="#C55A11"/>
  <text x="520" y="488" text-anchor="middle" font-size="19" font-weight="bold" fill="#833C00">Camada 1 — Pipeline Lakehouse (DuckDB)</text>
  <text x="520" y="516" text-anchor="middle" font-size="16" fill="#333">bronze (PII proposital) → silver (anonimizada) → gold (métricas)</text>
  <text x="520" y="540" text-anchor="middle" font-size="16" fill="#333">a Gold é a única camada exposta ao modelo</text>

  <line x1="520" y1="564" x2="520" y2="610" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="592" font-size="14" fill="#666" font-style="italic">resultado</text>

  <!-- Camada 4 -->
  <rect x="120" y="614" width="800" height="96" rx="12" fill="#FFF2CC" stroke="#BF9000"/>
  <text x="520" y="648" text-anchor="middle" font-size="19" font-weight="bold" fill="#7F6000">Camada 4 — Validação de saída</text>
  <text x="520" y="676" text-anchor="middle" font-size="16" fill="#333">aterramento anti-alucinação · filtro de campo sensível</text>
  <text x="520" y="698" text-anchor="middle" font-size="16" fill="#333">auditoria da resposta entregue</text>

  <line x1="520" y1="710" x2="520" y2="756" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Resposta -->
  <rect x="320" y="760" width="400" height="64" rx="12" fill="#ECECEC" stroke="#9E9E9E"/>
  <text x="520" y="798" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Resposta ao usuário</text>
</svg>
